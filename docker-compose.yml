services:
  core:
    build: .
    command: uvicorn service:app --host 0.0.0.0 --port 9000
    environment:
      - ORBIT_DATA_DIR=/data
    volumes:
      - orbit-data:/data
    expose:
      - "9000"          # internal network only; not published to the host
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  gateway:
    build: .
    command: uvicorn gateway:app --host 0.0.0.0 --port 8000
    environment:
      - ORBIT_DATA_DIR=/data
      - ORBIT_CORE_URL=http://core:9000
      - ORBIT_GATEWAY_URL=http://gateway:8000
    volumes:
      - orbit-data:/data
    ports:
      - "8000:8000"
    depends_on:
      core:
        condition: service_healthy
    restart: unless-stopped

volumes:
  orbit-data:
